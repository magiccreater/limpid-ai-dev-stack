router_settings:
  # Names from earlier versions of this stack (clients may still use them).
  model_group_alias:
    local-coder: private-coder
    hybrid-agent: private-coder
    claude-opus: cloud-opus
    claude-opus-5.5: cloud-opus
    free-auto: free-nemotron-ultra
  # Fallbacks belong here (not inside a model entry, where LiteLLM ignores them).
  # Private models fall back only to private models.
  fallbacks:
    - private-coder: ["private-coder-lite"]
    - private-general: ["private-coder"]
    - private-reasoner: ["private-general"]
    - private-glm: ["private-reasoner"]
    - local-coder: ["private-coder-lite"]     # aliases need their own fallback entry
    - hybrid-agent: ["private-coder-lite"]
    - free-auto:
        - "free-ernie"
        - "free-nemotron-super"
        - "free-particle"
        - "free-flint"
        - "free-dots"
        - "free-ling"
        - "free-nemotron-nano"
        - "free-gemma-31b"
        - "free-gemma-26b"
  num_retries: 1
  # Daily caps per provider. Tracked in memory, so they reset when LiteLLM restarts:
  # the AWS Budget alarm and the OpenRouter key's credit limit are the real backstops.
  provider_budget_config:
    bedrock:
      budget_limit: 3.0            # USD
      time_period: 1d
    openrouter:
      budget_limit: 3.0            # USD
      time_period: 1d

litellm_settings:
  drop_params: true                # drop OpenAI params a provider does not support

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# TypeSafe Jev (~typesafe/jev-latest) is not a chat model and is not routed here.
# Use shared/devstack_shared/jev_client.py (OpenRouter Decisions API) for routing.
