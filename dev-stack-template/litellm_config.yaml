# LiteLLM gateway: one OpenAI-compatible endpoint (http://127.0.0.1:4000/v1) for
# Cline, Continue, Aider, OpenClaw and the example agents.
# Start with: just litellm   (binds 127.0.0.1 and refuses to start without a real key)
#
# Two kinds of model, kept apart on purpose:
#
#   PRIVATE: Amazon Bedrock in Sydney (ap-southeast-2). AWS says Bedrock does not store
#   or log prompts, does not use them for training, and does not share them with the
#   model makers. Use these for client code, finances and personal documents.
#     private-coder       Qwen3 Coder Next          coding and agents (default)
#     private-coder-lite  Qwen3 Coder 30B A3B       cheaper; fallback for private-coder
#     private-general     Qwen3 235B A22B 2507      writing, summaries, general questions
#     private-reasoner    DeepSeek V3.2             harder reasoning
#     private-glm         GLM 5                     strongest private model, about 3x the price
#   (GLM 5.3 is on Bedrock only through a *global* profile that may route outside
#   Australia, and only for eligible accounts, so it is not a private model here.)
#   A private model only ever falls back to another private model, never to OpenRouter.
#   Old names local-coder and hybrid-agent are aliases of private-coder.
#
#   OPEN: OpenRouter, for non-sensitive work only (public data, research, drafts).
#   Every request asks for zero-data-retention providers; also turn ZDR on for your
#   whole account at https://openrouter.ai/settings/privacy.
#     open-deepseek   DeepSeek V4 Flash   very cheap
#     open-qwen       Qwen3 Coder Next    cheap
#     open-glm        GLM 5.3             strongest open model; reasoning always on, so
#                                         it writes many output tokens (about 10x the price)
#     cloud-reasoner  Claude Sonnet 5.5   expensive; capped below, and
#                     shared/devstack_shared/llm.py refuses it unless ALLOW_FRONTIER=1
#
# Fallbacks react to errors, not to bad answers: pick a stronger model name when needed.
# Model IDs and prices were checked in October 2026 (AWS model cards and pricing page:
# Sydney on-demand, Standard tier; openrouter.ai). Sydney is about 3% dearer than the US.
# Update both as models change. Qwen3 Coder 30B is marked
# Legacy by AWS, end of life 2027-03-30.

model_list:
  # ---------- Private: Amazon Bedrock, Sydney ----------
  # Region is pinned here on purpose so data cannot drift to another region by an env var.
  # Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (see aws/README.md).
  - model_name: private-coder
    litellm_params:
      model: bedrock/converse/qwen.qwen3-coder-next
      aws_region_name: ap-southeast-2
      timeout: 300
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.000000515   # Sydney $0.515/M
      output_cost_per_token: 0.000001236  # Sydney $1.236/M
      supports_function_calling: true     # so LiteLLM passes tools through to Converse

  - model_name: private-coder-lite
    litellm_params:
      model: bedrock/converse/qwen.qwen3-coder-30b-a3b-v1:0
      aws_region_name: ap-southeast-2
      timeout: 300
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000016    # Sydney $0.1545/M
      output_cost_per_token: 0.00000062   # Sydney $0.618/M
      supports_function_calling: true

  - model_name: private-general
    litellm_params:
      model: bedrock/converse/qwen.qwen3-235b-a22b-2507-v1:0
      aws_region_name: ap-southeast-2
      timeout: 300
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000023    # Sydney $0.2266/M
      output_cost_per_token: 0.00000091   # Sydney $0.9064/M
      supports_function_calling: true

  - model_name: private-reasoner
    litellm_params:
      model: bedrock/converse/deepseek.v3.2
      aws_region_name: ap-southeast-2
      timeout: 600
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000064    # Sydney $0.6386/M
      output_cost_per_token: 0.00000191   # Sydney $1.9055/M
      supports_function_calling: true

  - model_name: private-glm
    litellm_params:
      model: bedrock/converse/zai.glm-5
      aws_region_name: ap-southeast-2
      timeout: 600
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000103    # Sydney $1.03/M
      output_cost_per_token: 0.0000033    # Sydney $3.30/M
      supports_function_calling: true

  # ---------- Open: OpenRouter (non-sensitive only) ----------
  - model_name: open-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 180
      extra_body: {provider: {zdr: true}}   # only zero-data-retention providers
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000128

  - model_name: open-qwen
    litellm_params:
      model: openrouter/qwen/qwen3-coder-next
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 180
      extra_body: {provider: {zdr: true}}
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.0000008

  - model_name: open-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.3
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600                  # reasoning is always on
      extra_body: {provider: {zdr: true}}
      max_budget: 1.0              # USD per budget_duration for this model ($1/month)
      budget_duration: 30d
    model_info:                     # priced at Bedrock's global rate, above OpenRouter's, to be safe
      input_cost_per_token: 0.00000168
      output_cost_per_token: 0.00000528

  # ---------- Free: OpenRouter :free models (public code only) ----------
  # No cost, but rate limited and weaker than the open-* models. No free provider offers
  # zero data retention, so these allow data collection: never send client code, finances
  # or private repos. Use "free-auto": it starts with the best free model and moves down
  # the chain in router_settings.fallbacks when one is rate limited or fails.
  - model_name: free-nemotron-ultra
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300
      extra_body: {provider: {zdr: false, data_collection: allow}}   # free providers keep prompts
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
      supports_function_calling: true

  - model_name: free-ernie
