# Simple local RAG stack (AnythingLLM or swap for Open WebUI)
# For production you may prefer a dedicated vector DB + your own indexer.

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: local-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - JWT_SECRET=change-me-in-production
      # Point AnythingLLM at LiteLLM:
      # - OPEN_AI_BASE_PATH=http://host.docker.internal:4000/v1
      # - OPEN_MODEL_PREF=hybrid-agent
    volumes:
      - rag_storage:/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rag_storage:
