[project]
name = "devstack-shared"
version = "0.2.0"
description = "Shared LiteLLM and Jev clients for the dev stack's agents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "langchain-openai>=0.3",
]

[project.optional-dependencies]
test = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devstack_shared"]
